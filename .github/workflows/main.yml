name: Stock Monitor

on:
  schedule:
    - cron: '*/1 * * * *'  # 5분마다 실행하라는 마법의 주문!
  workflow_dispatch:       # 내가 원할 때 수동으로 버튼 눌러서 실행하는 기능

jobs:
  build:
    runs-on: ubuntu-latest # 깃허브가 빌려주는 무료 리눅스 컴퓨터

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: 파이썬 부품(라이브러리) 설치
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4
        
    - name: 품절 확인 요원 실행!
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python stock.py

